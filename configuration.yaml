homeassistant:
  packages: !include_dir_named packages

# Loads default set of integrations. Do not remove.
default_config:

# Wake-on-LAN service (required for WoL)
wake_on_lan:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes


automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# ===== Template entities (switch + sensor + cover + binary_sensor) =====
template:
  - switch:
      - name: "ทีวีห้องนั่งเล่น"
        unique_id: lg_tv_power_switch
        icon: mdi:television
        state: "{{ is_state('media_player.lg_webos_tv_65un7200ptf', 'on') }}"
        turn_on:
          - service: wake_on_lan.send_magic_packet
            data:
              mac: "58:FD:B1:C6:57:BF"
              broadcast_address: "192.168.1.255"
              broadcast_port: 9
          - delay: "00:00:03"
          - service: wake_on_lan.send_magic_packet
            data:
              mac: "58:FD:B1:C6:57:BF"
              broadcast_address: "192.168.1.255"
              broadcast_port: 9
          - delay: "00:00:03"
          - service: wake_on_lan.send_magic_packet
            data:
              mac: "58:FD:B1:C6:57:BF"
              broadcast_address: "192.168.1.255"
              broadcast_port: 9
          - delay: "00:00:03"
          - service: wake_on_lan.send_magic_packet
            data:
              mac: "58:FD:B1:C6:57:BF"
              broadcast_address: "192.168.1.255"
              broadcast_port: 9
        turn_off:
          - service: media_player.turn_off
            target:
              entity_id: media_player.lg_webos_tv_65un7200ptf

      - name: "แอร์ห้องนอน"
        unique_id: bedroom_ac_switch
        icon: mdi:air-conditioner
        state: "{{ is_state('binary_sensor.sthaanaae_rh_ngn_n_contact', 'on') }}"
        turn_on:
          - action: mqtt.publish
            data:
              topic: zigbee2mqtt/ไออาร์ห้องนอน/set
              payload: '{"ir_code_to_send": ""}'
        turn_off:
          - action: mqtt.publish
            data:
              topic: zigbee2mqtt/ไออาร์ห้องนอน/set
              payload: '{"ir_code_to_send": ""}'

      - name: "ปลั้กข้างประตู"
        unique_id: plakkhaangpratuu_siri_switch
        icon: mdi:power-socket
        state: "{{ is_state('switch.aifaethwlaangh_ngnangeln_l1', 'on') }}"
        turn_on:
          - service: switch.turn_on
            target:
              entity_id: switch.aifaethwlaangh_ngnangeln_l1
        turn_off:
          - service: switch.turn_off
            target:
              entity_id: switch.aifaethwlaangh_ngnangeln_l1

      - name: "กล้องห้องนั่งเล่น"
        unique_id: living_room_cam_enable
        icon: mdi:cctv
        # ON = กล้องทำงาน (privacy = off)
        state: "{{ is_state('switch.tapo_c225_2a63_privacy', 'off') }}"
        turn_on:
          - service: switch.turn_off
            target:
              entity_id: switch.tapo_c225_2a63_privacy
        turn_off:
          - service: switch.turn_on
            target:
              entity_id: switch.tapo_c225_2a63_privacy

  - trigger:
      - platform: time_pattern
        minutes: "/1"
    sensor:
      - name: "Current Time"
        state: "{{ now().strftime('%H:%M') }}"
      - name: "Current Date"
        state: >
          {% set days = ["st", "nd", "rd"] %}
          {% set day = now().day %}
          {{ now().strftime('%A ') }}{{ day }}{{ days[day-1] if day in range(1, 4)
          and day not in range(11, 14) else 'th' }} {{ now().strftime('%B %Y') }}

  - sensor:
      # ponytail: verified snapshots; append each new billing period after checking
      # MEA/ERC. Unknown future periods stay unavailable instead of reusing old Ft.
      - name: "MEA Residential Tariff"
        unique_id: mea_residential_tariff
        icon: mdi:transmission-tower
        state: "verified_manual"
        attributes:
          tariff_class: "1.2"
          source: "https://www.mea.or.th/our-services/service-rates/other/D5xEaEwgU"
          ft_source: "https://erc.or.th/th/automatic/"
          verified_on: "2026-09-09"
          billing_periods: >
            {{ [
              {'from': '2026-05-01', 'through': '2026-08-31',
               'tiers': [{'up_to': 150, 'rate': 3.2484}, {'up_to': 400, 'rate': 4.2218}, {'up_to': none, 'rate': 4.4217}],
               'service_charge': 24.62, 'ft': 0.1623, 'vat': 7},
              {'from': '2026-09-01', 'through': '2026-12-31',
               'tiers': [{'up_to': 200, 'rate': 3.0000}, {'up_to': 400, 'rate': 4.1584}, {'up_to': none, 'rate': 4.3583}],
               'service_charge': 24.62, 'ft': 0.1623, 'vat': 7}
            ] }}

      - name: "ค่าไฟ (bill cycle)"
        unique_id: energy_meter_bill_cost
        unit_of_measurement: "฿"
        icon: mdi:cash
        availability: >
          {% set reset = state_attr('sensor.energy_meter_bill_cycle', 'next_reset') %}
          {% set billing_date = (as_datetime(reset) | as_local).strftime('%Y-%m-%d') if reset else '' %}
          {% set periods = state_attr('sensor.mea_residential_tariff', 'billing_periods') or [] %}
          {{ has_value('sensor.mea_residential_tariff')
             and is_number(states('sensor.energy_meter_bill_cycle'))
             and states('sensor.energy_meter_bill_cycle') | float(-1) >= 0
             and periods | selectattr('from', 'le', billing_date) | selectattr('through', 'ge', billing_date) | list | count == 1 }}
        state: >
          {% set kwh = states('sensor.energy_meter_bill_cycle') | float(none) %}
          {% set reset = state_attr('sensor.energy_meter_bill_cycle', 'next_reset') %}
          {% set billing_date = (as_datetime(reset) | as_local).strftime('%Y-%m-%d') if reset else '' %}
          {% set periods = state_attr('sensor.mea_residential_tariff', 'billing_periods') or [] %}
          {% set matches = periods | selectattr('from', 'le', billing_date) | selectattr('through', 'ge', billing_date) | list %}
          {% if kwh is not none and kwh >= 0 and matches | count == 1 %}
            {% set tariff = matches[0] %}
            {% set charge = namespace(energy=0, previous=0) %}
            {% for tier in tariff.tiers %}
              {% set upper = tier.up_to if tier.up_to is not none else kwh %}
              {% set charge.energy = charge.energy + max(0, min(kwh, upper) - charge.previous) * tier.rate %}
              {% set charge.previous = upper %}
            {% endfor %}
            {{ ((charge.energy + tariff.service_charge + kwh * tariff.ft) * (1 + tariff.vat / 100)) | round(2) }}
          {% else %}
            {{ none }}
          {% endif %}

      - name: "Washer Time Remaining Formatted"
        state: >
          {% set finish_raw = states('sensor.ekhruue_ngchakphaa_remaining_time') %}
          {% if finish_raw in ['unknown', 'unavailable'] %}
            เสร็จแล้ว
          {% else %}
            {% set finish = as_datetime(finish_raw) %}
            {% if finish == none %}
              เสร็จแล้ว
            {% else %}
              {% set diff = (finish - now()).total_seconds() %}
              {% if diff <= 0 %}
                เสร็จแล้ว
              {% else %}
                {% set h = (diff // 3600) | int %}
                {% set m = ((diff % 3600) // 60) | int %}
                {% set s = (diff % 60) | int %}
                {{ "{:02d}:{:02d}:{:02d}".format(h, m, s) }}
              {% endif %}
            {% endif %}
          {% endif %}

  - cover:
      - name: "ประตูรั้ว"
        unique_id: gate_cover_toggle
        device_class: shutter
        # อ่านจากตัว normalized (trigger-based) ที่คงค่าล่าสุดไว้แล้ว
        # ไม่อ่าน binary_sensor.gate_controller_gate ตรง ๆ เพราะ dp105=1/11 -> unknown
        state: >
          {{ 'open' if is_state('binary_sensor.sthaanapratuuraw', 'on') else 'closed' }}
        open_cover:
          - service: button.press
            target:
              entity_id: button.gate_controller_open
        close_cover:
          - service: button.press
            target:
              entity_id: button.gate_controller_close

  - binary_sensor:
      - name: "me_home"
        unique_id: me_home
        device_class: presence
        state: "{{ is_state('device_tracker.drydream', 'home') }}"

      - name: "girlfriend_home"
        unique_id: girlfriend_home
        device_class: presence
        state: "{{ is_state('device_tracker.ipad_3', 'home') }}"

  # trigger-based: อัปเดตเฉพาะตอนต้นทางเป็น on/off จริง
  # ตัวคุมรั้วหลุด WiFi แล้วกลับมาด้วย dp105=1 (ลืมตำแหน่ง) -> ต้นทาง unknown ค้าง
  # แบบ trigger จะไม่ขยับ = คงค่าล่าสุด แทนที่จะเดาว่า "เปิด"
  - triggers:
      - trigger: state
        entity_id: binary_sensor.gate_controller_gate
        to:
          - "on"
          - "off"
    binary_sensor:
      - name: "gate_controller_gate_normalized"   # <-- ชื่อนี้กำหนด entity_id เป็น binary_sensor.gate_controller_gate_normalized
        unique_id: gate_controller_gate_normalized
        device_class: door
        state: "{{ trigger.to_state.state == 'on' }}"
        attributes:
          friendly_name: "สถานะประตูรั้ว"            # แสดงชื่อเป็นภาษาไทย
          source_state: "{{ trigger.to_state.state }}"
switch:
  - platform: wake_on_lan
    name: DryDrEaM PC
    mac: "30:56:0F:1A:0E:B7"
    host: 192.168.1.186          # ping เพื่อรู้สถานะจริง (ไม่งั้น assumed_state ค้างที่ off)

# ===== YouTube Music Desktop (PC) =====
rest:
  - resource: http://192.168.1.186:9863/api/v1/state
    scan_interval: 10
    timeout: 4
    headers:
      Authorization: !secret ytmd_token
      Accept: application/json
    sensor:
      - name: "YouTube Music"
        unique_id: ytmd_now_playing
        icon: mdi:youtube
        value_template: >
          {% set ts = value_json.player.trackState if value_json.player is defined else -1 %}
          {% if ts == 1 %}playing
          {% elif ts == 0 %}paused
          {% elif ts == 2 %}buffering
          {% else %}idle{% endif %}
      - name: "YouTube Music Title"
        unique_id: ytmd_title
        icon: mdi:music-note
        value_template: "{{ (value_json.video.title if value_json.video else '')[:255] }}"
      - name: "YouTube Music Artist"
        unique_id: ytmd_artist
        icon: mdi:account-music
        value_template: "{{ (value_json.video.author if value_json.video else '')[:255] }}"
      - name: "YouTube Music Album"
        unique_id: ytmd_album
        icon: mdi:album
        value_template: "{{ (value_json.video.album if value_json.video else '')[:255] }}"
      - name: "YouTube Music Thumbnail"
        unique_id: ytmd_thumbnail
        value_template: >
          {% if value_json.video and value_json.video.thumbnails %}{{ value_json.video.thumbnails[-1].url }}{% endif %}
      - name: "YouTube Music Duration"
        unique_id: ytmd_duration
        icon: mdi:timer-outline
        unit_of_measurement: s
        value_template: "{{ value_json.video.durationSeconds | default(0) if value_json.video else 0 }}"
      - name: "YouTube Music Progress"
        unique_id: ytmd_progress
        icon: mdi:progress-clock
        unit_of_measurement: s
        value_template: "{{ value_json.player.videoProgress | default(0) | round(0) if value_json.player is defined else 0 }}"

# YouTube Music Desktop control commands
rest_command:
  ytmd_play_pause:
    url: "http://192.168.1.186:9863/api/v1/command"
    method: POST
    headers:
      Authorization: !secret ytmd_token
      Content-Type: application/json
    payload: '{"command":"playPause"}'
  ytmd_next:
    url: "http://192.168.1.186:9863/api/v1/command"
    method: POST
    headers:
      Authorization: !secret ytmd_token
      Content-Type: application/json
    payload: '{"command":"next"}'
  ytmd_previous:
    url: "http://192.168.1.186:9863/api/v1/command"
    method: POST
    headers:
      Authorization: !secret ytmd_token
      Content-Type: application/json
    payload: '{"command":"previous"}'
  ytmd_volume_up:
    url: "http://192.168.1.186:9863/api/v1/command"
    method: POST
    headers:
      Authorization: !secret ytmd_token
      Content-Type: application/json
    payload: '{"command":"volumeUp"}'
  ytmd_volume_down:
    url: "http://192.168.1.186:9863/api/v1/command"
    method: POST
    headers:
      Authorization: !secret ytmd_token
      Content-Type: application/json
    payload: '{"command":"volumeDown"}'
  ytmd_mute:
    url: "http://192.168.1.186:9863/api/v1/command"
    method: POST
    headers:
      Authorization: !secret ytmd_token
      Content-Type: application/json
    payload: '{"command":"mute"}'

  # LG webOS Dev Mode session renew (resets to 50h). Full URL incl. sessionToken
  # lives in secrets (gitignored). Token from TV: cat /var/luna/preferences/devmode_enabled
  lg_devmode_renew:
    url: !secret lg_devmode_renew_url
    method: GET

# ===== PC remote control =====
shell_command:
  shutdown_drydream_pc: >-
    ssh -i /config/.ssh/id_ed25519
    -o UserKnownHostsFile=/config/.ssh/known_hosts
    -o BatchMode=yes -o ConnectTimeout=5
    DryDrEaM_Champ@192.168.1.186 "shutdown /s /t 0"
  # NAS UPS safe shutdown. Command is forced by authorized_keys on the NAS
  # (command="sudo /volume1/docker/nut/shutdown-cmd.sh"), so the arg below is ignored.
  nas_safe_shutdown: >-
    ssh -i /config/.ssh/id_ed25519
    -o UserKnownHostsFile=/config/.ssh/known_hosts
    -o BatchMode=yes -o ConnectTimeout=5
    drydream@192.168.1.170 x
  delete_calendar_event: "python3 /config/delete_calendar_event.py {{ event_id }}"
  set_event_status: "python3 /config/set_event_status.py {{ event_id }} {{ status }}"

# ===== TTS =====
tts:
  - platform: google_translate
    service_name: google_say
    language: 'th'

# ===== Input booleans =====
input_boolean:
  dog_home:
    name: "หมาอยู่บ้าน"
    icon: mdi:dog
  living_room_motion:
    name: "มีการเคลื่อนไหวห้องนั่งเล่น"
    icon: mdi:motion-sensor

# ===== Timers =====
timer:
  living_room_motion:
    name: "Timer เคลื่อนไหวห้องนั่งเล่น"
    duration: "00:05:00"

# ===== Input selects =====
input_select:
  calendar_year_filter:
    name: "กรองตามปี"
    options:
      - "All"
      - "2025"
      - "2026"
      - "2027"
    initial: "All"
    icon: mdi:calendar-filter
  calendar_month_filter:
    name: "กรองตามเดือน"
    options:
      - "All"
      - "January"
      - "February"
      - "March"
      - "April"
      - "May"
      - "June"
      - "July"
      - "August"
      - "September"
      - "October"
      - "November"
      - "December"
    initial: "All"
    icon: mdi:calendar-month

# ===== Utility meters =====
utility_meter:
  electricity_cost_monthly:
    source: sensor.etaaaiffaa_energy_cost
    cycle: monthly
  energy_meter_bill_cycle:
    source: sensor.energy_meter_energy_consumed_a_total
    cycle: monthly
    offset:
      days: 16

# ===== Lovelace =====
lovelace:
  mode: storage
  dashboards:
    dashboard-mylist:
      mode: yaml
      title: "My List"
      icon: mdi:format-list-bulleted
      show_in_sidebar: true
      filename: dashboards/mylist/mylist.yaml

# ===== Calendar full-history sensor (bypasses HA's built-in -90 day sync limit) =====
command_line:
  - sensor:
      name: calendar_events_list
      command: "python3 /config/google_calendar_history.py"
      scan_interval: 300
      value_template: "{{ now() }}"
      json_attributes:
        - events
