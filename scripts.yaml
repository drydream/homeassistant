toggle_bedroom_ac:
  alias: Toggle แอร์ห้องนอน
  mode: single
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.bedroom_ir_blaster
      state: 'off'
    then:
    - action: notify.mobile_app_drydream
      data:
        message: IR บล็อกเตอร์ห้องนอนออฟไลน์ กดปิด/เปิดแอร์ไม่ได้ตอนนี้ ลองถอดปลั๊ก/เสียบใหม่
    - stop: IR blaster offline
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.sthaanaae_rh_ngn_n_contact
        state: 'on'
      sequence:
      - action: shell_command.ac_bedroom_off
    default:
    - action: shell_command.ac_bedroom_on
open_door_for_4_seconds:
  alias: เปิดรั้วนิดเดียว
  mode: single
  sequence:
  - service: button.press
    target:
      entity_id: button.gate_controller_open
  - delay: 00:00:05
  - service: button.press
    target:
      entity_id: button.gate_controller_stop
add_calendar_note:
  alias: add_calendar_note
  mode: single
  sequence:
  - target:
      entity_id: calendar.drydream_event_s
    data:
      summary: '{{ states(''input_text.note_text'') }}'
      description: '{% set d = states(''input_text.note_description'') %} {{ ''''
        if d in [''unknown'',''None''] else d }}

        '
      start_date: '{{ states(''input_datetime.note_date'')[:10] }}'
      end_date: '{{ (strptime(states(''input_datetime.note_date'')[:10], ''%Y-%m-%d'')
        + timedelta(days=1)).strftime(''%Y-%m-%d'') }}

        '
    action: calendar.create_event
  - target:
      entity_id: input_text.note_text
    data:
      value: ''
    action: input_text.set_value
  - target:
      entity_id: input_text.note_description
    data:
      value: ''
    action: input_text.set_value
  - target:
      entity_id: input_datetime.note_date
    data:
      date: '{{ now().strftime(''%Y-%m-%d'') }}'
    action: input_datetime.set_datetime
delete_calendar_event:
  alias: delete_calendar_event
  mode: single
  fields:
    event_id:
      description: Google Calendar event id
      selector:
        text:
  sequence:
  - action: shell_command.delete_calendar_event
    data:
      event_id: '{{ event_id }}'
  - delay: 00:00:02
  - action: homeassistant.update_entity
    target:
      entity_id: sensor.calendar_events_list
set_event_status:
  alias: set_event_status
  mode: single
  fields:
    event_id:
      description: Google Calendar event id
      selector:
        text:
    status:
      description: planning | ongoing | done
      selector:
        select:
          options:
          - planning
          - ongoing
          - done
  sequence:
  - action: shell_command.set_event_status
    data:
      event_id: '{{ event_id }}'
      status: '{{ status }}'
  - delay: 00:00:02
  - action: homeassistant.update_entity
    target:
      entity_id: sensor.calendar_events_list
load_event_for_edit:
  alias: โหลดกิจกรรมเพื่อแก้ไข
  mode: single
  fields:
    event_id:
      description: Google Calendar event id
      selector:
        text:
  sequence:
  - variables:
      the_event: "{{ state_attr('sensor.calendar_events_list', 'events')\n   | selectattr('id',
        'eq', event_id) | list | first | default(none) }}\n"
  - condition: template
    value_template: '{{ the_event is not none }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.note_text
    data:
      value: '{{ the_event.summary }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.note_description
    data:
      value: '{{ the_event.description | default('''') }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.note_date
    data:
      date: '{{ the_event.start[:10] }}'
