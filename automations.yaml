- id: '1755242476717'
  alias: เปิดรั้วนิดเดียว(siri)
  mode: restart
  trigger:
  - platform: state
    entity_id: input_boolean.fench_open_short_siri
    to: 'on'
  action:
  - service: script.turn_on
    target:
      entity_id: script.open_door_for_4_seconds
  - delay: 00:00:01
